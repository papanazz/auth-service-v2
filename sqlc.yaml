version: "2"

sql:
  - engine: "postgresql"

    schema:
      - "migrations"

    queries:
      - "queries"

    gen:
      go:
        package: "sqlc"

        out: "internal/platform/postgres/sqlc"

        sql_package: "pgx/v5"

        emit_json_tags: true

        overrides:

          # =====================================================
          # UUID
          # =====================================================

          # UUID NOT NULL
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"


          # UUID NULL
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true



          # =====================================================
          # TIMESTAMP
          # =====================================================

          # timestamp NOT NULL
          - db_type: "pg_catalog.timestamp"
            go_type:
              import: "time"
              type: "Time"


          # timestamp NULL
          - db_type: "pg_catalog.timestamp"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true



          # =====================================================
          # TIMESTAMPTZ
          # =====================================================

          # timestamptz NOT NULL
          - db_type: "pg_catalog.timestamptz"
            go_type:
              import: "time"
              type: "Time"


          # timestamptz NULL
          - db_type: "pg_catalog.timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true



          # =====================================================
          # VARCHAR
          # =====================================================

          # nullable varchar
          - db_type: "pg_catalog.varchar"
            nullable: true
            go_type:
              type: "string"
              pointer: true



          # =====================================================
          # TEXT
          # =====================================================

          # nullable text
          - db_type: "pg_catalog.text"
            nullable: true
            go_type:
              type: "string"
              pointer: true



          # =====================================================
          # NUMERIC
          # =====================================================

          - db_type: "pg_catalog.numeric"
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"
              pointer: true