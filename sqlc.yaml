version: "2"

sql:
  - engine: "postgresql"
    schema:
      - "migrations"
    queries:
      - "queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/platform/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        overrides:
          # PostgreSQL UUID -> Go UUID
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"

          # PostgreSQL timestamp -> time.Time
          - db_type: "pg_catalog.timestamp"
            go_type:
              import: "time"
              type: "Time"

          # PostgreSQL timestamptz -> time.Time
          - db_type: "pg_catalog.timestamptz"
            go_type:
              import: "time"
              type: "Time"

           # PostgreSQL timestamp -> time.Time
          - db_type: "pg_catalog.timestamp"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true

          # PostgreSQL timestamptz -> time.Time
          - db_type: "pg_catalog.timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true

          - db_type: "pg_catalog.varchar"
            nullable: true
            go_type:
              type: "string"

          - column: "sessions.user_agent" # Replace with your_table.your_column
            nullable: true
            go_type:
              type: "string"

          - db_type: pg_catalog.numeric
            go_type:
              import: github.com/shopspring/decimal
              type: Decimal
              pointer: true